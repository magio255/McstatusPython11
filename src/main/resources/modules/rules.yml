header: "&#EA427F===== ᴘʀᴀᴠɪᴅʟᴀ sᴇʀᴠᴇʀᴜ ====="
rules:
  - "§71. &#00fbffɴᴇʙᴜď ᴛᴏxɪᴄᴋý ᴀ ʀᴇsᴘᴇᴋᴛᴜᴊ ᴏsᴛᴀᴛɴí."
  - "§72. &#00fbffᴢᴀᴋáᴢáɴᴏ ᴘᴏᴜžíᴠáɴí ᴄʜᴇᴀᴛů ᴀ ʜᴀᴄᴋů."
  - "§73. &#00fbffɴᴇsᴘᴀᴍᴜᴊ ᴀ ɴᴇᴅěʟᴇᴊ ʀᴇᴋʟᴀᴍᴜ."
  - "§74. &#00fbffɢʀɪᴇꜰɪɴɢ ᴊᴇ ᴘřísɴě ᴢᴀᴋáᴢáɴ."
  - "§75. &#00fbffɴᴇᴢɴᴇᴜžíᴠᴇᴊ ᴄʜʏʙʏ ʜʀʏ."

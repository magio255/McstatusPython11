# MagioCore Config

# Join Message Settings
join-message:
  show-head: true

  # Global message shown when a player joins for the first time
  first-join:
    format: "&#00fbff%player% §7se poprvé připojil! Vítej na &#00fbffCZSK SMP!"
    side-messages:
      - ""
      - "&#00fbffVÍTEJ"
      - "§7Hráč &#00fbff%player%"
      - "§7se poprvé"
      - "§7připojil na"
      - "&#00fbffCZSK SMP!"
      - ""
      - "§7Užij si to!"

  # Private message shown to the player when they login
  private-welcome:
    format: "§7Vítej zpět, &#00fbff%player%§7! Doufáme, že si tu užiješ čas."
    side-messages:
      - ""
      - "&#00fbffVÍTEJ ZPĚT"
      - "§7Ahoj &#00fbff%player%§7!"
      - "§7Doufáme, že si"
      - "§7u nás na serveru"
      - "§7užiješ spoustu"
      - "§7zábavy!"
      - "§7Šťastné hraní!"

# AFK Zone Settings
afk-zone:
  region-name: "afk"
  reward-command: "eco give %player% 10" # Command to run every minute

# Anti Spam Settings
anti-spam:
  delay: 2 # Delay in seconds between messages

# RTP GUI Settings
rtp:
  gui:
    title: "VýBěR sVěTA"
    rows: 3
    background: "BLACK_STAINED_GLASS_PANE"
    worlds:
      world:
        material: "GRASS_BLOCK"
        slot: 11
        name: "&#37FF00OVERWORLD"
        lore:
          - ""
          - " &8| &fStav: &#2ECC71Online"
          - " &8| &fTyp: &7Dimenze"
          - ""
          - " &#2ECC71> &7Teleportuj se na náhodné místo"
          - " &#2ECC71> &7v hlavním světě."
          - ""
          - "&#2ECC71LEVÝ KLIK &8• &fPro Teleport"
      nether:
        material: "NETHERRACK"
        slot: 13
        name: "&#E74C3CNETHER"
        lore:
          - ""
          - " &8| &fStav: &#E74C3COnline"
          - " &8| &fTyp: &7Dimenze"
          - ""
          - " &#E74C3C> &7Teleportuj se na náhodné místo"
          - " &#E74C3C> &7v nebezpečném netheru."
          - ""
          - "&#E74C3CLEVÝ KLIK &8• &fPro Teleport"
      end:
        material: "END_STONE"
        slot: 15
        name: "&#A569BDEND"
        lore:
          - ""
          - " &8| &fStav: &#A569BDOnline"
          - " &8| &fTyp: &7Dimenze"
          - ""
          - " &#A569BD> &7Teleportuj se na náhodné místo"
          - " &#A569BD> &7v temném endu."
          - ""
          - "&#A569BDLEVÝ KLIK &8• &fPro Teleport"
  settings:
    radius: 5000
    max-attempts: 10

# Spawn Location
spawn: null

# AFK Location
afk-location: null

# Daily Rewards
daily-rewards:
  command: "eco give %player% 1000"
  gui:
    title: "DENNí ODMěNA"
    chest-name: "&#ffbb00KLIKNI PRO ODMěNU!"
    chest-lore:
      - "§7Získej svou denní odměnu."
      - ""
      - "&#00ff44➥ KLIKNI PRO ZÍSKÁNÍ"
    cooldown-lore:
      - "§cOdměnu si můžeš vybrat"
      - "§cza %time%."

# Playtime Rewards
playtime-rewards:
  gui:
    title: "ODEHRANý čAs - úROVNě"
  levels:
    # Example levels, will be expanded in code to 147
    level-1:
      hours: 1
      command: "eco give %player% 500"
      name: "úROVEň 1"
    level-147:
      hours: 1300
      command: "eco give %player% 100000"
      name: "úROVEň 147"
